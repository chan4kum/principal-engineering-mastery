name: Curriculum checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --python 3.12 --locked --extra math --extra api
      - run: uv run --locked --extra math --extra api ruff check .
      - run: uv run --locked --extra math --extra api pytest -q
      - name: Observe FastAPI scheduling and Python allocation labs
        shell: bash
        run: |
          set -euo pipefail
          lab=01-architecture-A01-to-A20/A03-python-runtime-and-backend-apis/labs
          uv run --locked --extra api python "$lab/behavior.py" | tee behavior.log
          grep -F 'blocking=False, elapsed=' behavior.log
          grep -F 'blocking=True, elapsed=' behavior.log
          uv run --locked python "$lab/profiling.py" | grep -F 'retained_chunks=8 '
          uv run --locked python "$lab/profiling.py" --break | grep -F 'retained_chunks=120 '
  linux-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Process, quota and memory observations
        shell: bash
        run: |
          set -euo pipefail
          lab="$PWD/01-architecture-A01-to-A20/A01-computer-systems-and-os/labs"
          common=(--network none --pids-limit 32 -v "$lab:/lab:ro")
          docker run --rm "${common[@]}" python:3.12-slim python /lab/process_anatomy.py | tee process.log
          grep -q 'PPid:' process.log
          docker run --rm "${common[@]}" python:3.12-slim python /lab/process_anatomy.py --break | grep 'returncode: -15'
          docker run --rm "${common[@]}" --cpus=1 python:3.12-slim python /lab/cpu_io.py wait
          docker run --rm "${common[@]}" --cpus=1 python:3.12-slim python /lab/cpu_io.py cpu
          docker run --rm "${common[@]}" --cpus=.25 python:3.12-slim python /lab/cpu_io.py cpu | tee cpu.log
          before=$(sed -n 's/^cpu.stat before: .*nr_throttled \([0-9]*\),.*/\1/p' cpu.log)
          after=$(sed -n 's/^cpu.stat after: .*nr_throttled \([0-9]*\),.*/\1/p' cpu.log)
          test "$after" -gt "$before"
          docker run --rm "${common[@]}" --memory 64m --memory-swap 64m python:3.12-slim python /lab/memory_pressure.py | grep 'allocated=16 MiB'
          id=$(docker create "${common[@]}" --memory 64m --memory-swap 64m python:3.12-slim python /lab/memory_pressure.py --break)
          trap 'docker rm -f "$id" >/dev/null' EXIT
          docker start "$id"
          status=$(docker wait "$id")
          docker logs "$id"
          oom=$(docker inspect --format '{{.State.OOMKilled}}' "$id")
          printf 'Container exit status: %s, OOMKilled: %s\n' "$status" "$oom"
          test "$status" = 137
          test "$oom" = true
  networking-labs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: [L1, L2, L3, L4]
    steps:
      - uses: actions/checkout@v7
      - run: bash 01-architecture-A01-to-A20/A02-networking-and-communication/labs/run.sh "${{ matrix.lab }}"
