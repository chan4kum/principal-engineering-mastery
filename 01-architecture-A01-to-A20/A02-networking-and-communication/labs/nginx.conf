server {
    listen 8080;
    location = /live {
        return 200 "ready\n";
    }
    location / {
        proxy_pass http://routed-api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3s;
    }
    location = /broken {
        proxy_pass http://routed-api:8000/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 200ms;
    }
    location = /buffered {
        proxy_pass http://routed-api:8000/stream;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 3s;
    }
}
