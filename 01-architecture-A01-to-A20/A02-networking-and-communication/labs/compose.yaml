services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: pem-a02-api
    networks: [packet]
  packet-client:
    build:
      context: .
      dockerfile: Dockerfile.tools
    image: pem-a02-tools
    command: ["sleep", "infinity"]
    volumes:
      - ./packet.sh:/lab/packet.sh:ro
      - ./tls.sh:/lab/tls.sh:ro
    networks: [packet]
  routed-api:
    image: pem-a02-api
    networks:
      backend:
        ipv4_address: 172.31.242.10
  gateway:
    image: pem-a02-tools
    command: ["sleep", "infinity"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      frontend:
        ipv4_address: 172.31.241.2
      backend:
        ipv4_address: 172.31.242.2
  routed-client:
    image: pem-a02-tools
    command: ["sleep", "infinity"]
    cap_add: [NET_ADMIN]
    networks:
      frontend:
        ipv4_address: 172.31.241.10
  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]
  proxy-client:
    image: pem-a02-tools
    command: ["sleep", "infinity"]
    networks: [backend]
networks:
  packet:
    internal: true
  frontend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.241.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.242.0/24
